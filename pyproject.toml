[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "torcwa"
version = "0.1.0"
description = "torch + rcwa: a PyTorch implementation of rigorous coupled-wave analysis"
readme = "README.md"
license = {text = "LGPL-3.0"}
authors = [{name = "Alexin-CH"}]
requires-python = ">=3.8"
dependencies = [
    "torch>=1.10.1",
    "numpy>=1.21.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.61.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["torcwa*"]
